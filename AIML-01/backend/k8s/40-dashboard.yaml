apiVersion: apps/v1
kind: Deployment
metadata: {name: dashboard, namespace: fraud}
spec:
  replicas: 1
  selector: {matchLabels: {app: dashboard}}
  template:
    metadata: {labels: {app: dashboard}}
    spec:
      containers:
      - name: dashboard
        image: fraud-dashboard:0.1
        imagePullPolicy: Never
        ports: [{containerPort: 8501}]
        env: [{name: DB_URL, valueFrom: {secretKeyRef: {name: fraud-secrets, key: db_url}}}]
---
apiVersion: v1
kind: Service
metadata: {name: dashboard, namespace: fraud}
spec: {type: NodePort, selector: {app: dashboard}, ports: [{port: 8501, targetPort: 8501}]}
