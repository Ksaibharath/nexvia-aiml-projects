apiVersion: apps/v1
kind: Deployment
metadata: {name: fraud-api, namespace: fraud}
spec:
  replicas: 2
  selector: {matchLabels: {app: fraud-api}}
  template:
    metadata: {labels: {app: fraud-api}}
    spec:
      containers:
      - name: api
        image: fraud-api:0.1
        imagePullPolicy: Never
        ports: [{containerPort: 8080}]
        envFrom: [{configMapRef: {name: fraud-config}}]
        env: [{name: DB_URL, valueFrom: {secretKeyRef: {name: fraud-secrets, key: db_url}}}]
        readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 20, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /live, port: 8080}, initialDelaySeconds: 40, periodSeconds: 10}
        resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: fraud-api, namespace: fraud}
spec: {selector: {app: fraud-api}, ports: [{port: 8080}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: fraud-api, namespace: fraud}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fraud-api}
  minReplicas: 2
  maxReplicas: 3
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
