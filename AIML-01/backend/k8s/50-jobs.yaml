apiVersion: batch/v1
kind: Job
metadata: {name: producer, namespace: fraud}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: producer
        image: fraud-api:0.1
        imagePullPolicy: Never
        command: ["python", "-m", "fraud.serving.producer", "--bootstrap", "kafka:9092", "--rate", "50", "--limit", "5000"]
        volumeMounts: [{name: data, mountPath: /app/data/processed/labels.parquet, subPath: labels.parquet}]
      volumes: [{name: data, hostPath: {path: /data, type: Directory}}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: drift-check, namespace: fraud}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: drift
            image: fraud-api:0.1
            imagePullPolicy: Never
            command: ["python", "-m", "fraud.monitoring.drift"]
            envFrom: [{configMapRef: {name: fraud-config}}]
            env: [{name: DB_URL, valueFrom: {secretKeyRef: {name: fraud-secrets, key: db_url}}}]
