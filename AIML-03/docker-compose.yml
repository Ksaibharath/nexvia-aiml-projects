services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  triton:
    image: nvcr.io/nvidia/tritonserver:24.05-py3
    command: tritonserver --model-repository=/models --model-control-mode=poll --repository-poll-secs=30
    volumes: ["./triton/model_repository:/models"]
    ports: ["8000:8000", "8001:8001", "8002:8002"]

  api:
    build: .
    command: uvicorn src.serving.api:app --host 0.0.0.0 --port 8080
    environment: ["REDIS_HOST=redis", "TRITON_URL=triton:8000"]
    volumes:
      - "./artifacts:/app/artifacts:ro"
      - "./data/processed:/app/data/processed:ro"
      - "./configs:/app/configs:ro"
    depends_on: [redis, triton]
    ports: ["8080:8080"]

  ui:
    build: .
    command: streamlit run src/serving/ui.py --server.port 8501 --server.address 0.0.0.0
    environment: ["API_URL=http://api:8080"]
    depends_on: [api]
    ports: ["8501:8501"]
