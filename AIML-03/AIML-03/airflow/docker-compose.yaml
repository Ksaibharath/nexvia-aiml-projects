services:
  airflow-webserver:
    image: apache/airflow:2.9.2-python3.10
    command: standalone
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _PIP_ADDITIONAL_REQUIREMENTS=pyyaml numpy pandas pyarrow faiss-cpu redis scikit-learn scipy
      - REDIS_HOST=host.docker.internal
    volumes:
      - ./dags:/opt/airflow/dags
      - ../:/opt/project
    ports:
      - "8085:8080"
